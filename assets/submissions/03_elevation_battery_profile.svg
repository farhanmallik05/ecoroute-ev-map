<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" style="background:#020617;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="elevFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="batteryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="550" fill="#020617" />
  
  <!-- Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="extrabold">Topographical Elevation &amp; EV Battery Drainage Profile</text>
    <text x="0" y="48" fill="#94a3b8" font-size="13">Corridor: San Francisco (Sea Level) → Sacramento → Echo Summit (7,382 ft) → Lake Tahoe Basin</text>
  </g>

  <!-- Metric Badges -->
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="190" height="60" rx="14" fill="#0f172a" stroke="#1e293b" />
    <text x="20" y="24" fill="#94a3b8" font-size="11">TOTAL ELEVATION ASCENT</text>
    <text x="20" y="48" fill="#38bdf8" font-size="18" font-weight="bold">+7,420 ft climb</text>

    <rect x="210" y="0" width="190" height="60" rx="14" fill="#0f172a" stroke="#1e293b" />
    <text x="230" y="24" fill="#94a3b8" font-size="11">REGEN ENERGY RECOVERED</text>
    <text x="230" y="48" fill="#34d399" font-size="18" font-weight="bold">+14.2 kWh gained</text>

    <rect x="420" y="0" width="190" height="60" rx="14" fill="#0f172a" stroke="#1e293b" />
    <text x="440" y="24" fill="#94a3b8" font-size="11">NET ENERGY USED</text>
    <text x="440" y="48" fill="#f59e0b" font-size="18" font-weight="bold">52.8 kWh (77kWh pack)</text>

    <rect x="630" y="0" width="250" height="60" rx="14" fill="#064e3b" stroke="#10b981" />
    <text x="650" y="24" fill="#a7f3d0" font-size="11">RESERVE AT DESTINATION</text>
    <text x="650" y="48" fill="#ffffff" font-size="18" font-weight="extrabold">32% SoC (Safe Margin)</text>
  </g>

  <!-- Elevation Graph Frame -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="880" height="240" rx="20" fill="#0f172a" stroke="#1e293b" />

    <!-- Grid lines -->
    <line x1="80" y1="40" x2="840" y2="40" stroke="#1e293b" stroke-dasharray="4 4" />
    <text x="40" y="45" fill="#64748b" font-size="11">8,000 ft</text>

    <line x1="80" y1="100" x2="840" y2="100" stroke="#1e293b" stroke-dasharray="4 4" />
    <text x="40" y="105" fill="#64748b" font-size="11">5,000 ft</text>

    <line x1="80" y1="160" x2="840" y2="160" stroke="#1e293b" stroke-dasharray="4 4" />
    <text x="40" y="165" fill="#64748b" font-size="11">2,000 ft</text>

    <line x1="80" y1="210" x2="840" y2="210" stroke="#1e293b" />
    <text x="40" y="215" fill="#64748b" font-size="11">0 ft</text>

    <!-- Elevation Curve Area & Line -->
    <path d="M 80 210 L 180 205 L 360 200 L 520 180 L 680 70 L 740 50 L 780 120 L 840 130 L 840 210 Z" fill="url(#elevFill)" />
    <path d="M 80 210 L 180 205 L 360 200 L 520 180 L 680 70 L 740 50 L 780 120 L 840 130" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />

    <!-- Key Waypoints Callouts -->
    <circle cx="80" cy="210" r="5" fill="#ffffff" />
    <text x="80" y="230" fill="#cbd5e1" font-size="10" text-anchor="middle">San Francisco (0 mi)</text>

    <circle cx="360" cy="200" r="5" fill="#ffffff" />
    <text x="360" y="230" fill="#cbd5e1" font-size="10" text-anchor="middle">Sacramento (88 mi)</text>

    <circle cx="520" cy="180" r="5" fill="#ffffff" />
    <text x="520" y="230" fill="#cbd5e1" font-size="10" text-anchor="middle">Auburn Foothills (122 mi)</text>

    <circle cx="740" cy="50" r="7" fill="#f59e0b" />
    <text x="740" y="35" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">Echo Summit: 7,382 ft</text>

    <circle cx="840" cy="130" r="6" fill="#10b981" />
    <text x="840" y="150" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">Lake Tahoe (198 mi)</text>
  </g>

  <!-- Legend Bottom -->
  <g transform="translate(60, 480)">
    <circle cx="10" cy="10" r="5" fill="#06b6d4" />
    <text x="25" y="14" fill="#cbd5e1" font-size="12">Topographical Terrain Elevation</text>

    <circle cx="280" cy="10" r="5" fill="#10b981" />
    <text x="295" y="14" fill="#cbd5e1" font-size="12">Regenerative Braking Descent Zone (+14.2 kWh)</text>

    <circle cx="680" cy="10" r="5" fill="#f59e0b" />
    <text x="695" y="14" fill="#cbd5e1" font-size="12">High-Consumption Ascent Zone</text>
  </g>
</svg>

