<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" style="background:#020617;font-family:system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Backdrop with subtle ambient glow -->
  <rect width="800" height="600" fill="#020617" />
  <circle cx="400" cy="300" r="280" fill="#10b981" fill-opacity="0.06" />

  <!-- Modal Dialog Card -->
  <g filter="url(#glow)">
    <rect x="100" y="50" width="600" height="500" rx="28" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Station Header Icon -->
    <rect x="135" y="85" width="52" height="52" rx="16" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1.5" />
    <path d="M 163 97 L 151 115 L 161 115 L 159 127 L 171 109 L 161 109 Z" fill="#34d399" />

    <!-- Station Title & Badges -->
    <text x="205" y="105" fill="#ffffff" font-size="20" font-weight="bold">South Lake Tahoe Alpine Clean Charge</text>
    <rect x="205" y="115" width="115" height="22" rx="6" fill="#1e293b" />
    <text x="262" y="130" fill="#cbd5e1" font-size="11" font-weight="600" text-anchor="middle">Electrify America</text>
    <rect x="330" y="115" width="105" height="22" rx="6" fill="#064e3b" />
    <text x="382" y="130" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">DC Ultra-Fast</text>

    <text x="205" y="155" fill="#94a3b8" font-size="12">📍 1001 Heavenly Village Way, South Lake Tahoe, CA</text>

    <!-- Key Metrics Grid -->
    <g transform="translate(135, 180)">
      <!-- Power Card -->
      <rect x="0" y="0" width="160" height="85" rx="18" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
      <text x="80" y="28" fill="#94a3b8" font-size="11" text-anchor="middle">MAX POWER</text>
      <text x="80" y="58" fill="#ffffff" font-size="24" font-weight="extrabold" text-anchor="middle">350 <tspan font-size="14" font-weight="normal" fill="#94a3b8">kW</tspan></text>

      <!-- Availability Card -->
      <rect x="185" y="0" width="160" height="85" rx="18" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
      <text x="265" y="28" fill="#94a3b8" font-size="11" text-anchor="middle">AVAILABLE STALLS</text>
      <text x="265" y="58" fill="#34d399" font-size="24" font-weight="extrabold" text-anchor="middle">5 <tspan font-size="14" font-weight="normal" fill="#94a3b8">/ 8 free</tspan></text>

      <!-- Pricing Card -->
      <rect x="370" y="0" width="160" height="85" rx="18" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
      <text x="450" y="28" fill="#94a3b8" font-size="11" text-anchor="middle">PRICING</text>
      <text x="450" y="58" fill="#f59e0b" font-size="20" font-weight="bold" text-anchor="middle">$0.45/kWh</text>
    </g>

    <!-- Clean Grid Percentage Progress Bar -->
    <g transform="translate(135, 290)">
      <rect x="0" y="0" width="530" height="70" rx="18" fill="#064e3b" fill-opacity="0.25" stroke="#10b981" stroke-width="1" />
      <text x="20" y="28" fill="#a7f3d0" font-size="12" font-weight="bold">☀️ Clean Renewable Energy Mix</text>
      <text x="510" y="28" fill="#34d399" font-size="14" font-weight="extrabold" text-anchor="end">100% Solar &amp; Hydro</text>
      
      <!-- Progress Bar Track -->
      <rect x="20" y="42" width="490" height="12" rx="6" fill="#0f172a" />
      <rect x="20" y="42" width="490" height="12" rx="6" fill="url(#barGrad)" />
    </g>

    <!-- Connectors & Amenities Row -->
    <g transform="translate(135, 385)">
      <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="bold">SUPPORTED CONNECTORS:</text>
      <rect x="0" y="12" width="65" height="24" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="32" y="28" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">NACS</text>
      
      <rect x="75" y="12" width="65" height="24" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="107" y="28" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">CCS 1</text>

      <rect x="150" y="12" width="85" height="24" rx="6" fill="#1e293b" stroke="#475569" />
      <text x="192" y="28" fill="#e2e8f0" font-size="11" font-family="monospace" text-anchor="middle">CHAdeMO</text>

      <text x="280" y="0" fill="#94a3b8" font-size="11" font-weight="bold">ON-SITE AMENITIES:</text>
      <text x="280" y="28" fill="#cbd5e1" font-size="11">☕ Coffee • ⛷️ Ski Resort • 🚻 Restrooms • 🌐 Wi-Fi</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(135, 455)">
      <rect x="0" y="0" width="380" height="48" rx="14" fill="#10b981" />
      <text x="190" y="30" fill="#022c22" font-size="14" font-weight="bold" text-anchor="middle">🧭 Set as Destination &amp; Calculate Route</text>

      <rect x="400" y="0" width="130" height="48" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="465" y="30" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Close</text>
    </g>
  </g>
</svg>

